name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runs the deterministic part of `make verify` in a clean Linux environment: the
# Rust hook unit tests, the mint inspector, and the multi-extension mint suites.
# The transfer-hook end-to-end scenario needs `cargo build-sbf` (the Solana
# platform tools) and is verified locally via `make verify`; it is skipped here so
# the badge stays reliable. The committed examples/VERIFICATION_OUTPUT.txt records
# a full local run including the e2e.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rust hook unit tests
        working-directory: examples/transfer-hook-allowlist
        run: cargo test

      - name: Mint inspector (tsc + tests)
        working-directory: examples/mint-inspector
        run: npm ci && npm test

      - name: Mint inspector (scored eval suite)
        working-directory: examples/mint-inspector
        run: npm run evals

      - name: Mint inspector (determinism gate)
        working-directory: examples/mint-inspector
        # The risk engine is pure, so the eval verdicts must be byte-identical across
        # runs. Run the suite twice and diff; any divergence fails the build.
        run: |
          npm run evals -- --json > /tmp/evals-run1.json
          npm run evals -- --json > /tmp/evals-run2.json
          diff /tmp/evals-run1.json /tmp/evals-run2.json && echo "deterministic: byte-identical eval output across two runs"

      - name: Mint inspector (live mainnet smoke, best-effort)
        working-directory: examples/mint-inspector
        run: npx vitest run tests/live-smoke.test.ts
        env:
          LIVE_RPC: "1"
        # The public RPC can be rate-limited or down; the test soft-skips on outage,
        # and this guard means a flaky endpoint never reds the badge.
        continue-on-error: true

      - name: Multi-extension mint (tsc + tests)
        working-directory: examples/ts-multi-extension-mint
        run: npm ci && npm test

  # Required check: the transfer-hook end-to-end scenario needs the Solana platform
  # tools (cargo build-sbf). It builds the hook and runs the full `make verify`,
  # including the on-chain blocked-then-allowed transfer. continue-on-error was
  # removed once this job was observed green on every main run since 2026-06-27; the
  # committed examples/VERIFICATION_OUTPUT.txt records a full local run.
  hook-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Solana platform tools (Agave)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Confirm cargo build-sbf is available
        run: cargo build-sbf --version

      - name: Build the hook and run the end-to-end scenario
        working-directory: examples
        run: make verify
